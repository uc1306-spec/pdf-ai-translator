<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 변경된 제목 -->
    <title>김망고 이미지 번역 툴</title>

    <!-- SEO & Open Graph -->
    <meta name="description" content="김망고 이미지 번역 툴 - PDF 문서와 이미지 속 텍스트를 실시간으로 인지하여 깔끔하게 다국어로 통번역해주는 무료 AI 웹 서비스입니다.">
    <meta name="keywords" content="김망고, 이미지번역, PDF번역, OCR번역, AI번역기, 무료번역">
    <meta property="og:type" content="website">
    <meta property="og:title" content="김망고 이미지 번역 툴">
    <meta property="og:description" content="PDF 문서 및 이미지속 텍스트를 깔끔하게 다국어로 AI 통번역해보세요.">
    <meta property="og:url" content="https://uc1306-spec.github.io/pdf-ai-translator/">

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbebe', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .whitespace-nowrap { white-space: nowrap; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 모바일 최적화 헤더 -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            
            <!-- 타이틀 (김망고 이미지 번역 툴) -->
            <div class="flex items-center space-x-3 min-w-0">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-amber-500 flex items-center justify-center text-white shadow-md shrink-0">
                    <i class="fa-solid fa-mango text-lg sm:text-xl">🥭</i>
                </div>
                <div class="min-w-0 flex-1">
                    <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight truncate">
                        김망고 이미지 번역 툴
                    </h1>
                    <p class="text-xs text-slate-500 font-medium truncate">
                        Gemini 3 Flash Vision Powered AI 통번역기
                    </p>
                </div>
            </div>

            <!-- 우측 액션 버튼 -->
            <div class="flex items-center gap-2 shrink-0 self-end sm:self-auto w-full sm:w-auto justify-end">
                <button id="openApiKeyBtn" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-amber-800 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-lg transition-all whitespace-nowrap">
                    <i class="fa-solid fa-key text-amber-600"></i>
                    <span>API 키 설정</span>
                </button>
                <button id="sampleDocBtn" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-orange-800 bg-orange-50 hover:bg-orange-100 border border-orange-200 rounded-lg transition-all whitespace-nowrap">
                    <i class="fa-solid fa-wand-magic-sparkles text-orange-600"></i>
                    <span>샘플 문서 테스트</span>
                </button>
            </div>

        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-8">
        
        <!-- 번역 작업 메인 영역 (기존 로직 유지) -->
        <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs text-center">
            <p class="text-slate-600 font-medium">🥭 이미지 및 PDF 문서를 업로드하여 번역을 진행해 보세요.</p>
        </section>

        <!-- 하단 비회원 댓글 / 방명록 영역 -->
        <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-6">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-comments text-amber-500"></i>
                    <span>댓글 및 의견 남기기</span>
                </h2>
                <span id="commentCount" class="text-xs font-semibold bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full">0개</span>
            </div>

            <!-- 댓글 작성 폼 (로그인 필요 없음) -->
            <form id="commentForm" class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="commentAuthor" placeholder="닉네임 (예: 망고좋아)" required
                           class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400">
                    <input type="password" id="commentPw" placeholder="비밀번호 (삭제용)" required
                           class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>
                <textarea id="commentText" rows="3" placeholder="자유롭게 댓글이나 건의사항을 남겨주세요!" required
                          class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 resize-none"></textarea>
                <div class="flex justify-end">
                    <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs sm:text-sm rounded-lg transition-all shadow-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>댓글 등록</span>
                    </button>
                </div>
            </form>

            <!-- 댓글 목록 -->
            <div id="commentList" class="space-y-3 pt-2">
                <!-- 댓글이 없을 경우 기본 메시지 -->
                <p id="emptyCommentMsg" class="text-center text-xs text-slate-400 py-6">
                    첫 번째 댓글을 작성해 보세요! 🥭
                </p>
            </div>
        </section>

    </main>

    <!-- 댓글 로컬 스토리지 작동 스크립트 -->
    <script>
        const COMMENT_STORAGE_KEY = 'kim_mango_comments';

        function loadComments() {
            const comments = JSON.parse(localStorage.getItem(COMMENT_STORAGE_KEY) || '[]');
            const listEl = document.getElementById('commentList');
            const countEl = document.getElementById('commentCount');
            
            countEl.textContent = `${comments.length}개`;
            listEl.innerHTML = '';

            if (comments.length === 0) {
                listEl.innerHTML = '<p class="text-center text-xs text-slate-400 py-6">첫 번째 댓글을 작성해 보세요! 🥭</p>';
                return;
            }

            comments.forEach((c, index) => {
                const item = document.createElement('div');
                item.className = 'bg-slate-50 border border-slate-100 rounded-xl p-4 space-y-1.5 relative group';
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-xs sm:text-sm text-slate-800">${escapeHtml(c.author)}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] text-slate-400">${c.date}</span>
                            <button onclick="deleteComment(${index})" class="text-xs text-slate-400 hover:text-red-500 transition-colors">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-xs sm:text-sm text-slate-600 whitespace-pre-wrap">${escapeHtml(c.text)}</p>
                `;
                listEl.appendChild(item);
            });
        }

        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const author = document.getElementById('commentAuthor').value.trim();
            const pw = document.getElementById('commentPw').value.trim();
            const text = document.getElementById('commentText').value.trim();

            if (!author || !pw || !text) return;

            const comments = JSON.parse(localStorage.getItem(COMMENT_STORAGE_KEY) || '[]');
            const newComment = {
                author,
                pw,
                text,
                date: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            };

            comments.unshift(newComment);
            localStorage.setItem(COMMENT_STORAGE_KEY, JSON.stringify(comments));

            document.getElementById('commentAuthor').value = '';
            document.getElementById('commentPw').value = '';
            document.getElementById('commentText').value = '';

            loadComments();
        });

        function deleteComment(index) {
            const comments = JSON.parse(localStorage.getItem(COMMENT_STORAGE_KEY) || '[]');
            const inputPw = prompt('댓글 작성 시 입력한 비밀번호를 입력하세요:');
            
            if (!inputPw) return;

            if (comments[index] && comments[index].pw === inputPw) {
                comments.splice(index, 1);
                localStorage.setItem(COMMENT_STORAGE_KEY, JSON.stringify(comments));
                loadComments();
            } else {
                alert('비밀번호가 일치하지 않습니다.');
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 초기 댓글 로드
        loadComments();
    </script>
</body>
</html>
